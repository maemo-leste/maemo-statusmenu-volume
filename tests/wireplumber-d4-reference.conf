# Reference wireplumber drop-in for droid4 (cpcap / "Mapphone Audio").
#
# Intended home: maemo-audio, /etc/wireplumber/wireplumber.conf.d/
# Keyed on the ALSA node-name pattern so it stays device-agnostic in form:
# the applet reads whatever the audio stack publishes and only warns when
# nothing is published at all.
#
# Property format: comma separated gain values in centibel, ascending.
# Converted by the applet with pa_sw_volume_from_dB() -- PulseAudio's CUBIC
# perceptual curve (dB = 60*log10(v/NORM)), not the electrical 20*log10.
#
# Derivation (verified against measured base_volume, zero delta):
#     base_volume = pa_sw_volume_from_dB(-tlv_max)
#     cB          = (hardware_dB - tlv_max) * 100
# See tests/gen-tuning-table.py --ctrl-min N --ctrl-max M to regenerate.

monitor.alsa.rules = [

  # ------------------------------------------------------------------
  # In-call: Voice Playback Volume, TLV -33..+12 dB, 3 dB/step, 16 positions.
  # Top 10 positions (ctrl 6..15) -> hw -15 dB .. +12 dB.
  # tlv_max = +12 dB, so cB = (hw_dB - 12) * 100.
  #
  #   slider 0.1 -> -15 dB -> ctrl  6      slider 0.6 ->  0 dB -> ctrl 11 (= base_volume)
  #   slider 0.2 -> -12 dB -> ctrl  7      slider 0.7 -> +3 dB -> ctrl 12
  #   slider 0.3 ->  -9 dB -> ctrl  8      slider 0.8 -> +6 dB -> ctrl 13
  #   slider 0.4 ->  -6 dB -> ctrl  9      slider 0.9 -> +9 dB -> ctrl 14
  #   slider 0.5 ->  -3 dB -> ctrl 10      slider 1.0 -> +12 dB -> ctrl 15
  #
  # hw -15 dB is within ~1 dB of the N900 in-call floor's attenuation
  # relative to each codec's own 0 dB point.
  # ------------------------------------------------------------------
  {
    matches = [
      { node.name = "~alsa_output\.platform-soundcard\.Voice_Call__.*__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning.incall = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
      }
    }
  },

  # ------------------------------------------------------------------
  # Normal / media: HiFi Playback Volume, same TLV (-33..+12 dB, 3 dB/step).
  #
  # NOT SHIPPED YET -- needs a decision. Fremantle wants 20 logical steps but
  # the control only has 16 hardware positions, so a 20-entry table cannot map
  # every slider position to a distinct hardware level. Options:
  #
  #   a) 16 steps, exact hardware match (fewer than Fremantle's 20)
  #      ctrl 0..15 -> hw -33..+12 -> cB -4500 .. 0 in 300 steps:
  #      "-4500,-4200,-3900,-3600,-3300,-3000,-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
  #
  #   b) 20 steps over the same span -- 4 pairs of slider positions will
  #      land on the same hardware level and the slider will appear to do
  #      nothing for those steps.
  #
  # Until this is resolved the applet falls back to the built-in N900 media
  # ladder and logs one warning per sink.
  # ------------------------------------------------------------------

]

# Reference wireplumber drop-in for droid4 (cpcap / "Mapphone Audio").
#
# Intended home: maemo-audio, /etc/wireplumber/wireplumber.conf.d/
#
# THE CONTRACT: every sink declares BOTH properties.
#
#   x-maemo.volume.tuning         ladder when no call-role stream is present
#   x-maemo.volume.tuning.incall  ladder while one is
#
# The applet's rule is unconditional and knows nothing about what kind of
# node it is looking at:
#
#   ladder = call_active ? sink.tuning.incall : sink.tuning
#
# so a node must be able to answer both questions. Declaring only one is a
# configuration error: the applet falls back to the built-in N900 table for
# that mode and logs a warning naming the missing key.
#
# Do NOT overload the normal property to mean "call" on a call-only node.
# If a media stream ever lands on such a node -- a route change, an
# in-call tone, the default sink not having switched back yet after a call
# -- it would get the call curve as its media curve.
#
# For a node whose hardware can only do calls, both properties therefore
# carry the same call ladder. That is not duplication for its own sake: it
# states that this path has one curve, usable in either state.
#
# ---------------------------------------------------------------------
# WHY A SECOND LADDER EXISTS AT ALL
#
# A circuit-switched call has no host stream. The modem drives the codec
# directly through the UCM Voice Call verb and the call node appears as its
# own sink (verified: `pactl list sink-inputs` is empty during a CS call,
# and the node sits SUSPENDED because the DSP path bypasses PipeWire). So
# nothing will ever set call_active on that node -- the applet reads its
# .normal ladder while the call runs, which is why that one has to be the
# call ladder too.
#
# VOIP is the opposite: no UCM verb, no hardware path change, just a
# stream played through whatever the media sink is. That is the case
# .incall exists for.
#
# ---------------------------------------------------------------------
# PROPERTY FORMAT
#
# Comma separated gain values in centibel, ascending. Converted by the
# applet with pa_sw_volume_from_dB() -- PulseAudio's CUBIC perceptual
# curve (dB = 60*log10(v/NORM)), not the electrical 20*log10.
#
# Derivation (verified against measured base_volume, zero delta):
#     base_volume = pa_sw_volume_from_dB(-tlv_max)
#     cB          = (hardware_dB - tlv_max) * 100
# See tests/gen-tuning-table.py --ctrl-min N --ctrl-max M to regenerate.
#
# DO NOT ESCAPE DOTS IN THE MATCH PATTERNS. These files are parsed as
# SPA-JSON, where a backslash inside a quoted string is an escape
# character, and "\." is not a valid one. A file containing
# node.name = "~alsa_output\.platform-soundcard\.Voice_Call__.*__sink"
# is rejected outright with:
#
#   wp_conf_open: failed to open '...': section 'monitor.alsa.rules' has no value
#
# and the rules are silently absent -- every sink then falls back to the
# built-in ladder. Leave the dots bare; they match one character each,
# which is close enough for a node name we control.

monitor.alsa.rules = [

  # ------------------------------------------------------------------
  # Circuit-switched call node.
  #
  # Voice Playback Volume, TLV -33..+12 dB, 3 dB/step, 16 positions.
  # Top 10 positions (ctrl 6..15) -> hw -15 dB .. +12 dB.
  # tlv_max = +12 dB, so cB = (hw_dB - 12) * 100.
  #
  #   slider 0.1 -> -15 dB -> ctrl  6      slider 0.6 ->  0 dB -> ctrl 11 (= base_volume)
  #   slider 0.2 -> -12 dB -> ctrl  7      slider 0.7 -> +3 dB -> ctrl 12
  #   slider 0.3 ->  -9 dB -> ctrl  8      slider 0.8 -> +6 dB -> ctrl 13
  #   slider 0.4 ->  -6 dB -> ctrl  9      slider 0.9 -> +9 dB -> ctrl 14
  #   slider 0.5 ->  -3 dB -> ctrl 10      slider 1.0 -> +12 dB -> ctrl 15
  #
  # hw -15 dB is within ~1 dB of the N900 in-call floor's attenuation
  # relative to each codec's own 0 dB point.
  #
  # Both properties carry this ladder: the node is call-only, and with no
  # host stream on it the applet reads .normal during the call.
  # ------------------------------------------------------------------
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.Voice_Call__.*__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
        x-maemo.volume.tuning.incall = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
      }
    }
  },

  # ------------------------------------------------------------------
  # Media nodes.
  #
  # NOTE the two ladders on this node now follow different policies. The
  # normal ladder is "every hardware position up to unity gain plus one
  # boost step". The in-call ladder below is still the old Fremantle-shaped
  # 10-step table and tops out at 0 cB, which on this control is +12 dB --
  # four boost steps, not one. Applying the same policy there would make it
  # identical to the normal ladder (ctrl 0..12 again). Left alone for now
  # because the in-call range is a listening decision, not a hardware one.
  #
  # .incall is the same 10-step cpcap table as the CS call node, so a
  # VOIP call gets the same slider feel and the same absolute gain range
  # as a circuit-switched one. It only takes effect while a sink input
  # carries media.role of "phone" or "Communication" (case-insensitive).
  #
  # Getting a VOIP app to carry that role is a separate rule, and E now
  # depends on it: with no call-role stream there is nothing to select the
  # in-call ladder and nothing to write the call volume to. The place for
  # it is pulse.rules in pipewire-pulse.conf, keyed on the binary:
  #
  #   pulse.rules = [
  #     {
  #       matches = [
  #         { application.process.binary = "linphone" }
  #       ]
  #       actions = {
  #         update-props = { media.role = "phone" }
  #       }
  #     }
  #   ]
  #
  # Note this only assigns a role to clients that did not set one themselves
  # -- a client that already declares media.role=music keeps it, so an app
  # that mislabels a call as music has to be overridden at the client.
  #
  # .normal: every hardware position the cpcap HiFi path has, from the
  # bottom of the control up to unity gain, plus one step of boost.
  #
  # HiFi Playback Volume is TLV -33..+12 dB, 3 dB/step, 16 positions.
  # PipeWire puts PA_VOLUME_NORM on the TLV maximum, so base_volume
  # (41350) sits at hardware 0 dB, ctrl 11. Everything above that is
  # boost. Rather than invent Fremantle's 20 logical steps and have four
  # pairs of them collapse onto the same hardware level, the ladder is one
  # entry per hardware position:
  #
  #   ctrl  0 -> -33 dB   ctrl  5 -> -18 dB   ctrl 10 ->  -3 dB
  #   ctrl  1 -> -30 dB   ctrl  6 -> -15 dB   ctrl 11 ->   0 dB  <- base_volume
  #   ctrl  2 -> -27 dB   ctrl  7 -> -12 dB   ctrl 12 ->  +3 dB  <- the one boost
  #   ctrl  3 -> -24 dB   ctrl  8 ->  -9 dB
  #   ctrl  4 -> -21 dB   ctrl  9 ->  -6 dB
  #
  # 13 steps. ctrl 13..15 (+6, +9, +12 dB) are deliberately left off: the
  # slider tops out at +3 dB of boost instead of the +12 dB the codec can
  # be pushed to.
  #
  #   ./gen-tuning-table.py --ctrl-min 0 --ctrl-max 12 --tlv-max 12 --steps 13
  #
  # Note the ladder's top entry is -900 cB, not 0. The slider therefore
  # cannot reach PA_VOLUME_NORM (65536); its maximum is 46396. Anything
  # already set above that by another tool reads back as slider 1.0 and is
  # pulled down to <= +3 dB on the first move.
  # ------------------------------------------------------------------
  {
    matches = [
      { node.name = "~alsa_output.platform-soundcard.HiFi__.*__sink" }
    ]
    actions = {
      update-props = {
        x-maemo.volume.tuning        = "-4500,-4200,-3900,-3600,-3300,-3000,-2700,-2400,-2100,-1800,-1500,-1200,-900"
        x-maemo.volume.tuning.incall = "-2700,-2400,-2100,-1800,-1500,-1200,-900,-600,-300,0"
      }
    }
  },

  # ------------------------------------------------------------------
  # TODO: HDMI (platform-omap-hdmi-audio).
  #
  # Separate card, profile only available when plugged. No TLV measured on
  # the cpcap side because there is none -- HDMI volume is downstream.
  # Needs both properties before it can be considered supported; until
  # then it warns and uses the built-in N900 ladder.
  # ------------------------------------------------------------------

]

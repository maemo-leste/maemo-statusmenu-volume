# maemo-statusmenu-volume configuration
#
# sink_property names a property that the audio stack attaches to the sink
# and that holds the volume tuning table for that path.
#
# A tuning table is a comma separated list of gain values in centibel,
# ascending, for example:
#
#   "-4000,-3800,-3600,...,-200,0"
#
# The listed values are the volume steps; index 0 of the table the applet
# builds is always silence. Values are centibel, so -4000 is -40.00 dB and
# 0 is full scale. The list must be strictly ascending - entries that are
# not above their predecessor are skipped with a warning, because the
# slider mapping interpolates between neighbours.
#
# Note that these are centibel on the applet's own software scale, not the
# electrical 20*log10. libpulse maps volume to dB cubically:
# dB = 60 * log10(v / PA_VOLUME_NORM), so -60 dB is 0.1x amplitude, not
# 0.001x. Use tests/gen-tuning-table.py rather than doing this by hand.
#
# Nothing in upstream PulseAudio or PipeWire publishes these properties by
# itself. On PipeWire they are attached per device from a wireplumber
# drop-in, e.g.:
#
#   monitor.alsa.rules = [
#     { matches = [ { node.name = "~alsa_output.*" } ]
#       actions = { update-props = {
#           x-maemo.volume.tuning        = "-4000,-3800,...,0"
#           x-maemo.volume.tuning.incall = "-2000,-1600,...,0"
#   } } } ]
#
# Every sink is expected to declare BOTH properties. The applet's rule is
# unconditional and knows nothing about what kind of node it is reading:
#
#   ladder = call_active ? sink.tuning.incall : sink.tuning
#
# so each sink has to answer both questions. When a property is missing or
# unparseable the applet falls back to a built-in table and logs one
# warning per mode, so a missing drop-in is visible rather than silently
# substituting a curve that only looks plausible.

[normal]
# Tuning table for the sink while no call-role stream is present.
sink_property=x-maemo.volume.tuning

[incall]
# Tuning table for the same sink while a call is active.
#
# "a call is active" means: at least one sink input carries a call media
# role, matched case-insensitively against "phone" (the role documented in
# libpulse's proplist.h, and what Fremantle used) and "Communication" (the
# PipeWire / XDG portal role for interactive voice). The applet derives
# this by enumerating sink inputs, so it can ask at any moment instead of
# relying on an edge-triggered notification it may not have been listening
# for.
#
# This second ladder exists for VOIP: a VOIP call does not change the
# hardware path, it is just a stream played through the media sink, so the
# only way to give it a different gain curve is to swap the curve the
# slider uses on that sink.
#
# Note that while this ladder is in use the applet writes the call STREAM,
# not the sink. The ladder shapes the slider; the target of the write is
# the stream. That is what makes media and VOIP volume independent -- the
# media sink keeps whatever level the user left there, and wireplumber's
# role-keyed session restore persists the call level across restarts with
# nothing for the applet to store.
#
# A circuit-switched call is a different case: the modem drives the codec
# directly through the UCM Voice Call verb, the call node appears as its
# own separate sink, and there is no host stream at all. Nothing will ever
# put that node in the in-call state, so the applet reads its normal ladder
# while the call runs. Declare both properties on such a node anyway, and
# do not overload the normal one to mean "call": if a media stream ever
# landed there -- a route change, an in-call tone, the default sink not
# having switched back yet after a call -- it would get the call curve as
# its media curve. For a call-only path both properties therefore carry
# the same call ladder, which states that the path has one curve usable in
# either state. See tests/wireplumber-d4-reference.conf.
sink_property=x-maemo.volume.tuning.incall

[behavior]
swap_on_rotate=1
native_is_landscape=0

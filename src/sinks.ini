# maemo-statusmenu-volume configuration
#
# sink_property names a property that the audio server attaches to the sink and
# that holds the hardware volume tuning table for that path. The table is a
# comma separated list of millibel values, optionally prefixed with a mixer
# name and '=' (e.g. "HP DAC=1:-5850,31:-4350,118:0").
#
# Nothing in upstream PulseAudio or PipeWire publishes these properties by
# itself. On PipeWire they can be attached per device/profile from a
# wireplumber drop-in, e.g.:
#
#   monitor.alsa.rules = [
#     { matches = [ { node.name = "~alsa_output.*" } ]
#       actions = { update-props = {
#           x-maemo.alsa_sink.mixer_tuning     = "..."
#           x-maemo.alsa_sink.alt_mixer_tuning = "..."
#   } } } ]
#
# When a property is missing or unparseable the built-in default table is kept.

[normal]
# Tuning table used for the normal (media) volume.
sink_property=x-maemo.alsa_sink.mixer_tuning

[incall]
# Tuning table used while a call is active.
sink_property=x-maemo.alsa_sink.alt_mixer_tuning

[behavior]
swap_on_rotate=1
native_is_landscape=0
